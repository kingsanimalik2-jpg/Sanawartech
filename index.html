<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoSaver</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--ink:#10231e;--muted:#5a6b66;--card:#fff;--line:#d3dcd8;--accent:#0f6b57;--accent-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1815;--ink:#e8f1ee;--muted:#93a59f;--card:#16241f;--line:#2a3b35;--accent:#3ec7a3;--accent-ink:#06211a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:520px}
h1{font:800 clamp(2rem,9vw,3rem)/1.05 "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-.02em}
p.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
input[type=url]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.types{display:flex;gap:8px;margin:12px 0}
.types label{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.types input{position:absolute;opacity:0}
.types label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button{width:100%;font:600 1rem Figtree,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.5em;margin:12px 0 0;font-size:.95rem}
#msg.err{color:var(--err)}
.sites{color:var(--muted);font-size:.9rem;margin-top:16px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Video link paste karein, file save karein.</h1>
<p class="sub">TikTok, Instagram, Facebook, YouTube aur bohat se aur sites.</p>
<div class="card">
  <input id="url" type="url" placeholder="https://..." inputmode="url" autocomplete="off" aria-label="Video link">
  <div class="types">
    <label><input type="radio" name="t" value="video" checked>Video</label>
    <label><input type="radio" name="t" value="audio">Sirf audio</label>
  </div>
  <button id="go">Download karein</button>
  <p id="msg" role="status"></p>
</div>
<p class="sub sites">Sirf apni videos ya jin ki ijazat ho unhi ke liye istemal karein.</p>
</main>
<script>
// Backend ka URL yahan likhein (Render se milega), aakhir mein / nahi
const API_BASE="https://sanawartech.onrender.com";
const $=id=>document.getElementById(id), msg=$("msg"), go=$("go");
function say(t,e){msg.textContent=t;msg.className=e?"err":""}
go.onclick=async()=>{
  const url=$("url").value.trim();
  if(!url) return say("Pehle link paste karein.",true);
  go.disabled=true; say("Download ho raha hai, thora intezar karein…");
  try{
    const type=document.querySelector("input[name=t]:checked").value;
    const r=await fetch(API_BASE+"/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,type})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"Kuch masla aa gaya.")}
    const cd=r.headers.get("Content-Disposition")||"";
    const m=/filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(cd);
    const name=m?decodeURIComponent(m[1]):"video.mp4";
    const a=document.createElement("a");
    a.href=URL.createObjectURL(await r.blob()); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    say("Ho gaya! File save ho gayi.");
  }catch(e){say(e.message,true)}
  go.disabled=false;
};
</script>
</body>
</html>
